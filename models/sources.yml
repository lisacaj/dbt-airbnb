version: 2

sources:
  - name: stockholm_airbnb
    schema: dbt_yourname_airbnb    # Replace with your actual dataset name, e.g. dbt_anna_airbnb
    description: Raw Airbnb data for Stockholm listings and reviews.
    tables:
      - name: raw_listings
        description: One record per Airbnb listing in Stockholm. Contains listing details, host information, pricing, availability, and review scores.
        columns:
          - name: id
            description: Primary key — unique identifier for each listing.
          - name: name
            description: The listing title as shown on Airbnb.
          - name: host_id
            description: Unique identifier for the host.
          - name: host_name
            description: The host's first name.
          - name: host_since
            description: The date the host created their Airbnb account.
          - name: host_is_superhost
            description: Whether the host holds superhost status. Raw value is 't' or 'f'.
          - name: host_listings_count
            description: The number of listings the host has on Airbnb.
          - name: neighbourhood_cleansed
            description: The standardised neighbourhood name for the listing.
          - name: latitude
            description: Latitude coordinate of the listing.
          - name: longitude
            description: Longitude coordinate of the listing.
          - name: room_type
            description: The type of space offered. One of Entire home/apt, Private room, Shared room, or Hotel room.
          - name: accommodates
            description: The maximum number of guests the listing can accommodate.
          - name: bedrooms
            description: The number of bedrooms.
          - name: beds
            description: The number of beds.
          - name: price
            description: The nightly price as a raw string, e.g. $917.00 or $1,073.00.
          - name: minimum_nights
            description: The minimum number of nights required to book.
          - name: maximum_nights
            description: The maximum number of nights allowed per booking.
          - name: instant_bookable
            description: Whether the listing can be booked instantly without host approval. Raw value is 't' or 'f'.
          - name: review_scores_rating
            description: The overall review score on a scale of 0 to 5.
          - name: review_scores_cleanliness
            description: The cleanliness review score on a scale of 0 to 5.
          - name: review_scores_location
            description: The location review score on a scale of 0 to 5.
          - name: review_scores_value
            description: The value review score on a scale of 0 to 5.
          - name: number_of_reviews
            description: The total number of reviews the listing has received.
          - name: first_review
            description: The date of the first review.
          - name: last_review
            description: The date of the most recent review.
          - name: availability_365
            description: The number of days the listing is available in the next 365 days.
          - name: estimated_revenue_l365d
            description: Estimated revenue generated by the listing over the last 365 days.

      - name: raw_reviews
        description: One record per review left on a Stockholm Airbnb listing.
        columns:
          - name: id
            description: Primary key — unique identifier for each review.
          - name: listing_id
            description: Foreign key to raw_listings.id — the listing this review belongs to.
          - name: date
            description: The date the review was written.
          - name: reviewer_id
            description: Unique identifier for the reviewer.
          - name: reviewer_name
            description: The reviewer's first name.
          - name: comments
            description: The full text of the review.